<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/sunlit-matchday-design-system-347d00e7-60cf-4de5-975f-5d059faa1a3c/styles.css">
  <script src="_ds/sunlit-matchday-design-system-347d00e7-60cf-4de5-975f-5d059faa1a3c/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:32px;font-family:var(--font-body);color:var(--color-ink)">
  <sc-for list="{{ stages }}" as="s" hint-placeholder-count="2">
    <section style="display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--color-border-subtle)">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px">
        <h2 style="margin:0;font:700 22px/1 var(--font-display);text-transform:uppercase">{{ s.label }}</h2>
        <span style="font-size:14px;color:var(--color-muted);font-variant-numeric:tabular-nums">{{ s.range }} · {{ s.meta }}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px">
        <sc-for list="{{ s.matches }}" as="m" hint-placeholder-count="3">
          <dc-import name="MatchCard" match="{{ m }}" on-pick="{{ onPick }}" on-details="{{ onDetails }}" pick-style="{{ pickStyle }}" hint-size="100%,150px"></dc-import>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;stages&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onDetails&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;pickStyle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
